# Multi-region Kubernetes deployment with Route 53 latency routing
# Deploy this manifest to each target region: us-east-1, eu-west-1, ap-southeast-1

---
apiVersion: v1
kind: Namespace
metadata:
  name: lms-platform

---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-api
  namespace: lms-platform
  labels:
    app: lms-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lms-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lms-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["lms-api"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/lmsplatform/api:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lms-secrets
                  key: database-url
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: lms-secrets
                  key: redis-host
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lms-secrets
                  key: jwt-secret
            - name: AWS_REGION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['topology.kubernetes.io/region']
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: lms-api-service
  namespace: lms-platform
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: lms-api
  ports:
    - port: 443
      targetPort: 3001
      protocol: TCP

---
# Web App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-web
  namespace: lms-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-web
  template:
    metadata:
      labels:
        app: lms-web
    spec:
      containers:
        - name: web
          image: ghcr.io/lmsplatform/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: https://api.lmsplatform.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: lms-web-service
  namespace: lms-platform
spec:
  type: ClusterIP
  selector:
    app: lms-web
  ports:
    - port: 3000
      targetPort: 3000

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lms-api-hpa
  namespace: lms-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lms-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# PodDisruptionBudget for zero-downtime deploys
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lms-api-pdb
  namespace: lms-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: lms-api

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms-ingress
  namespace: lms-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  tls:
    - hosts:
        - app.lmsplatform.com
        - api.lmsplatform.com
      secretName: lms-tls
  rules:
    - host: app.lmsplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lms-web-service
                port:
                  number: 3000
    - host: api.lmsplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lms-api-service
                port:
                  number: 443
