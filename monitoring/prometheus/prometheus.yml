global:
  scrape_interval:     15s   # Default scrape every 15s
  evaluation_interval: 15s   # Evaluate rules every 15s
  external_labels:
    environment: production
    platform:    lms

# Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load alert + recording rules
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── LMS API ──────────────────────────────────────────────────────────────
  - job_name: lms-api
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          instance: lms-api
    metrics_path: /api/v1/metrics

  # ── PostgreSQL (via postgres_exporter) ───────────────────────────────────
  - job_name: postgresql
    static_configs:
      - targets: ['lms-postgres-exporter:9187']

  # ── Redis (via redis_exporter) ───────────────────────────────���───────────
  - job_name: redis
    static_configs:
      - targets: ['lms-redis-exporter:9121']

  # ── Node.js API (pm2 / docker stats) ────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Grafana ──────────────────────────────────────────────────────────────
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics
