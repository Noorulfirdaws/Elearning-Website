global:
  resolve_timeout: 5m

# Inhibit lower-severity alerts when a higher one fires for the same scope
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['job', 'instance']

  - source_match:
      alertname: APIDown
    target_match_re:
      alertname: '.+'
    equal: ['instance']

# Default route — all alerts go to the log receiver until Slack/PD are configured
route:
  group_by:        ['alertname', 'team']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: log

  routes:
    - match:
        severity: critical
      receiver: log

    - match:
        severity: warning
      receiver: log

receivers:
  # ── Fallback: log only (no external dependencies) ─────────────────────────
  # Replace with slack / pagerduty receivers once you have the webhook URLs.
  - name: log
    webhook_configs:
      - url: 'http://localhost:1/dev-null'
        send_resolved: false
        max_alerts: 0
